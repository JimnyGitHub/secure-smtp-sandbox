mail.protocol=smtp
mail.host=localhost
mail.port=1025
mail.smtp.connectiontimeout=5000
mail.smtp.timeout=5000

mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.starttls.required=true
mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
# Ne jamais mettre "*" ici (accepterait n'importe quel certificat). Un vrai certificat
# signe par une CA doit etre reconnu par le truststore par defaut de la JVM (cf. gestion
# des certificats). Cette propriete n'est utilisee que dans les tests, avec un
# certificat de test auto-signe, ou elle vaut "localhost".
mail.smtp.ssl.trust=

mail.user=changeit
mail.password=changeit
mail.from=sandbox@example.com
